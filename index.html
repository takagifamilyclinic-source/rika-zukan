`風《かぜ》が当たると、こおりのまわりでひやされた空気がふきとばされ、あたたかい空気がつぎつぎにふれます。だから早くとけます。`,`タオルのせんいのあいだには、空気がたくさんふくまれています。動《うご》かない空気は、熱をつたえにくいので、こおりに熱がとどきにくくなります。`,`しおをかけると、こおりのとける温度《おんど》が0℃より下がります。0℃よりつめたくてもとけるようになるのです。このときまわりから熱をうばうので、とてもつめたくなります。アイスクリームを作るときにつかうしくみです。`],terms:[[`断熱《だんねつ》`,`熱がつたわりにくいようにすること。`],[`融点《ゆうてん》`,`こおりなどがとけはじめる温度。水は0℃。`]]},person:{img:`black`,name:`ジョゼフ・ブラック`,years:`1728 – 1799`,who:`スコットランドの科学者《かがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#6b4a3a`,hairColor:`#ece8df`},story:[`こおりがとけているあいだは、あたためても温度《おんど》が上がらないことに気づきました。`,`あたえた熱《ねつ》は、こおりを水に変《か》えるためにつかわれていたのです。この目に見えない熱を「潜熱《せんねつ》」といいます。`,`じょうき機関《きかん》をよくしたワットとは、なかのよい友《とも》だちでした。`],sayLabel:`のこしたもの`,say:`「温度」と「熱」はべつのものだ、ということを、はかってたしかめました。`}},shadow:{running:`光のふしぎ　｜　かげ`,why:{title:`なぜ、かげができるの？`,paras:[`光は、まっすぐにすすみます。これを「光の直進《ちょくしん》」といいます。`,`光の通り道にものがあると、光はそこでさえぎられます。そのうしろに、光のとどかない場所《ばしょ》ができます。それがかげです。`,`光がひくいところから来ると、ななめに当たるので、かげは遠くまでのびます。高いところから来ると、かげはみじかくなります。`,`太陽《たいよう》は、朝に東からのぼり、昼に南の空でいちばん高くなり、夕方に西へしずみます。かげはその反対《はんたい》がわにできるので、1日のあいだに西から北、東へと動《うご》きます。`],terms:[[`光の直進《ちょくしん》`,`光がまっすぐにすすむこと。`],[`日時計《ひどけい》`,`かげの向《む》きで時こくを知る時計。`]]},person:{img:`eratosthenes`,name:`エラトステネス`,years:`紀元前《きげんぜん》276年ごろ – 紀元前194年ごろ`,who:`古代《こだい》ギリシャの学者《がくしゃ》`,look:{hair:`curly`,beard:`short`,collar:`toga`,cloth:`#8fa3b8`,hairColor:`#4a3a2c`},story:[`エジプトのアレクサンドリアにあった、大きな図書館《としょかん》の館長《かんちょう》でした。`,`夏至《げし》の日の正午《しょうご》、南のシエネという町では、いどのそこまで日がさします。ところが同じ時こくに、アレクサンドリアでは、ぼうにかげができました。`,`このかげの角度《かくど》と、2つの町のきょりから、地球《ちきゅう》1しゅうの長さを計算《けいさん》しました。`],sayLabel:`すごいところ`,say:`ぼうのかげだけで出したこたえは、今わかっている長さ（およそ4万km）に近いあたいだった、といわれています。`}},elec:{running:`電気のふしぎ　｜　でんき`,why:{title:`なぜ、明《あ》かりがつくの？`,paras:[`金《きん》ぞくの中には、自由《じゆう》に動《うご》ける、とても小さなつぶ（電子《でんし》）がたくさんあります。電池《でんち》をつなぐと、このつぶがいっせいに動きだします。これが電気のながれ、「電流《でんりゅう》」です。`,`電流は、電池から出て、また電池にもどる一《ひと》まわりの道がつながっているときだけ、ながれます。この道を「回路《かいろ》」といいます。`,`ゴムや木、プラスチックの中には、自由に動けるつぶがほとんどありません。だから電気を通しません。`,`豆電球《まめでんきゅう》の中には、フィラメントという細い線があります。電流がながれると、熱くなって光ります。えんぴつのしんは、炭素《たんそ》というものでできていて、電気を通します。`],terms:[[`導体《どうたい》`,`電気をよく通すもの。金ぞくなど。`],[`絶縁体《ぜつえんたい》`,`電気を通さないもの。ゴムなど。`]]},person:{img:`edison`,name:`エジソン`,years:`1847 – 1931`,who:`アメリカの発明家《はつめいか》`,look:{hair:`part`,collar:`bow`,cloth:`#3d4656`,hairColor:`#c9c4b8`},story:[`1879年、長い時間光りつづける電球《でんきゅう》を作りました。`,`光る線（フィラメント）のざいりょうをさがして、たくさんのものをためしました。日本の竹《たけ》をつかった電球は、とても長もちしました。京都《きょうと》の竹だったとつたえられています。`,`音をきろくするきかいなど、たくさんの発明をしました。`],say:`「天才《てんさい》とは、1%のひらめきと、99%の努力《どりょく》である」`}},seesaw:{running:`力のふしぎ　｜　シーソー`,why:{title:`なぜ、つりあうの？`,paras:[`シーソーのように、ささえる点のまわりで回るぼうを「てこ」といいます。ささえる点を「支点《してん》」といいます。`,`てこをかたむけるはたらきは、「おもさ」と「支点からのきょり」をかけた数で決《き》まります。`,`大きいおもりは、小さいおもり2こぶんの重《おも》さです。大きいおもりを目もり1に、小さいおもりを目もり2にのせると、2×1と1×2で同じになり、つりあいます。`,`支点から遠いところをおすと、小さな力で重いものを動《うご》かせます。くぎぬき、はさみ、せんぬき、つめ切りは、このしくみをつかった道具《どうぐ》です。`],terms:[[`支点《してん》`,`てこをささえている、動かない点。`],[`てこ`,`支点のまわりで回るぼう。小さな力を大きくできる。`]]},person:{img:`archimedes`,name:`アルキメデス`,years:`紀元前《きげんぜん》287年ごろ – 紀元前212年`,who:`古代《こだい》ギリシャの科学者《かがくしゃ》`,look:{hair:`bald`,beard:`big`,collar:`toga`,cloth:`#b9a987`,hairColor:`#e9e4d8`},story:[`「うく・しずむ」にも出てきたアルキメデスは、てこのきまりも、すじ道を立ててせつめいしました。`,`てこや、かっ車《しゃ》を組み合わせて、重《おも》い船《ふね》をひとりで動《うご》かしてみせた、という話がつたわっています。`,`数学《すうがく》でも、円《えん》や球《きゅう》について大きな発見《はっけん》をしました。`],say:`「わたしに立つ場所《ばしょ》をくれれば、地球《ちきゅう》でも動かしてみせよう」`}},sprout:{running:`生きもののふしぎ　｜　たねの芽`,why:{title:`なぜ、光がなくても芽《め》が出るの？`,paras:[`たねの中には、芽や根《ね》になるところと、そだつためのえいよう（でんぷんなど）が入っています。インゲンマメでは、「子葉《しよう》」というところにえいようをたくわえています。`,`たねが水をすうと、ふくらんで目をさまします。たくわえたえいようをつかって、根と芽をのばします。`,`たねも生きていて、いきをしています。だから空気がいります。水の中にしずめると、空気がたりなくて芽が出ません。寒《さむ》すぎても、たねの中のはたらきがすすみません。`,`芽が出るのにひつようなのは、水・空気・ちょうどよい温度《おんど》の3つです。光やひりょうは、芽が出たあと、大きくそだつためにひつようになります。`],terms:[[`発芽《はつが》`,`たねから芽が出ること。`],[`光合成《こうごうせい》`,`葉《は》が光をうけて、えいようを作るはたらき。`]]},person:{img:`makino`,name:`牧野富太郎《まきのとみたろう》`,years:`1862 – 1957`,who:`日本の植物学者《しょくぶつがくしゃ》`,look:{hair:`hat`,collar:`bow`,glasses:!0,cloth:`#6f7f5f`,hairColor:`#8a7a5e`},story:[`高知県《こうちけん》に生まれました。小学校をとちゅうでやめ、ひとりで植物《しょくぶつ》の勉強《べんきょう》をつづけました。`,`日本じゅうを歩いて植物をあつめ、じぶんでこまかい絵《え》をかいて図鑑《ずかん》を作りました。`,`名前をつけた植物は、1500しゅるいより多いといわれ、「日本の植物《しょくぶつ》分類学《ぶんるいがく》の父」とよばれています。`],say:`「雑草《ざっそう》という名の草はない」ということばで知られています。どんな草にも名前がある、という考えです。`}},ikura:{running:`ものづくりのふしぎ　｜　人工イクラ`,why:{title:`なぜ、つぶになるの？`,paras:[`色のついたえきには、「アルギン酸《さん》ナトリウム」がとけています。こんぶやわかめのぬるぬるのもとで、とても長いひものようなつぶでできています。`,`このえきを、カルシウムをとかした水に落《お》とすと、ひもとひもがカルシウムでつなぎ合わされ、あみの目のようになります。あみの目が水をとじこめて、ぷるぷるにかたまります。これを「ゲル」といいます。`,`かたまるのは、カルシウムにふれた外《そと》がわからです。だから、外はうすいまく、中はえきのままのつぶができます。長くつけておくと、中までかたまります。`,`ただの水にはカルシウムがほとんどないので、ひもがつながらず、えきはちってしまいます。`],terms:[[`ゲル`,`水をとじこめて、ぷるぷるにかたまったもの。ゼリーなど。`],[`分子《ぶんし》`,`ものを作っている、とても小さなつぶ。`]]},person:{img:`stanford`,name:`スタンフォード`,years:`1800年代《ねんだい》の人`,who:`イギリスの化学者《かがくしゃ》`,look:{hair:`part`,beard:`full`,collar:`cravat`,cloth:`#4a4f5c`,hairColor:`#6a5038`},story:[`海《かい》そうから、やくに立つものをとり出すけんきゅうをしていました。`,`1880年代《ねんだい》のはじめ、こんぶのなかまから、ぬるぬるのもとになる「アルギン酸《さん》」を見つけました。`,`のちに、日本の会社《かいしゃ》が、このしくみをつかって人工《じんこう》イクラを作りました。`],sayLabel:`いまのくらし`,say:`アルギン酸は、アイスクリームやゼリー、薬《くすり》など、いろいろなところでつかわれています。`}},space:{running:`うちゅうのふしぎ　｜　たいようけい`,why:{title:`なぜ、惑星《わくせい》は太陽のまわりを回るの？`,paras:[`太陽は、とても重《おも》い星です。重いものは、まわりのものを引っぱります。この力を「引力《いんりょく》」といいます。`,`惑星は、まっすぐすすもうとします。でも、太陽に引っぱられて、道がまがります。すすむいきおいと引力がつりあうので、太陽に落《お》ちることも、遠くへとんでいくこともなく、回りつづけます。`,`太陽に近い惑星ほど、強く引っぱられるので、速《はや》く回ります。水星《すいせい》は88日、海王星《かいおうせい》は165年で1しゅうします。`,`地球《ちきゅう》は、こまのように、1日に1回じぶんで回っています。太陽のほうを向《む》いたがわが昼、反対《はんたい》がわが夜です。地球のじくは少しかたむいているので、1年のあいだに日の当たり方が変《か》わり、きせつができます。`],terms:[[`引力《いんりょく》`,`ものとものが引き合う力。重いものほど強い。`],[`自転《じてん》・公転《こうてん》`,`じぶんで回ること・ほかの星のまわりを回ること。`]]},person:{img:`galileo`,name:`ガリレオ・ガリレイ`,years:`1564 – 1642`,who:`イタリアの科学者《かがくしゃ》`,look:{hair:`bald`,beard:`big`,collar:`ruff`,cloth:`#3d4656`,hairColor:`#cfc9bd`},story:[`じぶんで作ったぼうえんきょうを、空に向《む》けました。月がでこぼこしていることや、天《あま》の川がたくさんの星のあつまりであることを見つけました。`,`1610年には、木星《もくせい》のまわりを回る4つの星を見つけました。「すべての星は地球《ちきゅう》のまわりを回っている」という、それまでの考えに合わない発見《はっけん》でした。`,`地球が太陽のまわりを回っているという考えを本に書き、さいばんにかけられました。`],say:`「それでも地球は動《うご》く」。さいばんのあとで、そうつぶやいたとつたえられています。`}},moon:{running:`うちゅうのふしぎ　｜　月の形`,why:{title:`なぜ、月の形は変《か》わるの？`,paras:[`月は、ボールのような丸い星です。太陽《たいよう》の光は、いつも月の半分を照《て》らしています。`,`月は、地球《ちきゅう》のまわりを回っています。地球から月を見る向《む》きが、毎日少しずつ変わるので、光っているところの見え方が変わります。`,`太陽と同じがわにあるときは、光っている面《めん》が見えません。これが新月《しんげつ》です。地球をはさんで反対《はんたい》がわにくると、光っている面がぜんぶ見えて、満月《まんげつ》になります。`,`形がひとめぐりするのに、およそ29日半かかります。むかしの人は、月の形を見て日にちを数えました。「三日月《みかづき》」や「十五夜《じゅうごや》」ということばは、そのなごりです。`],terms:[[`新月《しんげつ》・満月《まんげつ》`,`月が見えないとき・まるく見えるとき。`],[`上弦《じょうげん》の月`,`新月から満月へむかうとちゅうの半月。`]]},person:{img:`shibukawa`,name:`渋川春海《しぶかわはるみ》`,years:`1639 – 1715`,who:`江戸時代《えどじだい》の天文学者《てんもんがくしゃ》`,look:{hair:`cap`,collar:`toga`,cloth:`#4a5568`,hairColor:`#2b2b2b`},story:[`碁《ご》を打つ家に生まれ、しょうぐんの前で碁を打つしごとをしていました。`,`月や太陽の動きを、じぶんでかんそくしました。そして、長いあいだつかわれてきたこよみが、じっさいの空とずれていることをたしかめました。`,`何度も失敗《しっぱい》しながら、日本人の手ではじめてのこよみを作りました。`],sayLabel:`のこしたもの`,say:`春海のこよみは「貞享暦《じょうきょうれき》」とよばれ、1685年からつかわれました。`}},emag:{running:`電気のふしぎ　｜　電じしゃく`,why:{title:`なぜ、電気でじしゃくになるの？`,paras:[`電気が流《なが》れている線のまわりには、じしゃくの力がはたらきます。1本の線では、とても弱い力です。`,`線をぐるぐるまいたものを「コイル」といいます。まいた数だけ力が重《かさ》なるので、たくさんまくほど強くなります。`,`コイルの中に鉄《てつ》のくぎを入れると、鉄そのものがじしゃくになって、さらに強くなります。電池《でんち》を直列《ちょくれつ》にふやして、流れる電気をふやしても、強くなります。`,`電気を止《と》めると、じしゃくではなくなります。電気の向《む》きをぎゃくにすると、N極《きょく》とS極が入れかわります。ふつうのじしゃくにはできないことです。`],terms:[[`コイル`,`線をぐるぐるまいたもの。`],[`電流《でんりゅう》`,`電気の流れ。大きいほど、電じしゃくは強くなる。`]]},person:{img:`faraday`,name:`ファラデー`,years:`1791 – 1867`,who:`イギリスの科学者《かがくしゃ》`,look:{hair:`curly`,collar:`cravat`,cloth:`#3d4656`,hairColor:`#6a5038`},story:[`まずしい家に生まれ、本を作る店ではたらきながら、店の本を読んで科学を学びました。`,`「電気からじしゃくの力が生まれるなら、じしゃくから電気も作れるはずだ」と考えました。1831年、じしゃくを動《うご》かすと電気が生まれることを見つけました。`,`発電所《はつでんしょ》で電気を作るしくみは、この発見《はっけん》がもとになっています。`],sayLabel:`のこしたもの`,say:`子どもたちのために科学のお話会を開きました。そのお話は「ロウソクの科学」という本になっています。`}},color:{running:`もののふしぎ　｜　色水`,why:{title:`なぜ、色が変《か》わるの？`,paras:[`むらさきキャベツの色のもとは、「アントシアニン」というものです。ブルーベリーや、ナス、赤じそにもふくまれています。`,`アントシアニンは、まわりが酸性《さんせい》か、アルカリ性《せい》かによって、つくりが少し変わります。つくりが変わると、色も変わって見えます。`,`酸性が強いほど赤く、アルカリ性が強いほど、青、みどり、黄色へと変わっていきます。色を見れば、どちらのなかまかがわかります。`,`アジサイの花の色が、うえた場所《ばしょ》によってちがうのも、土《つち》が酸性かどうかがかかわっています。`,`せんざいには、まぜるときけんなものがあります。本当にためすときは、かならずおとなといっしょに。`],terms:[[`酸性《さんせい》・アルカリ性《せい》`,`水にとけたもののせいしつ。まん中が中性《ちゅうせい》。`],[`指示薬《しじやく》`,`色の変わり方で、酸性かアルカリ性かを知らせるもの。`]]},person:{img:`boyle`,name:`ボイル`,years:`1627 – 1691`,who:`アイルランド生まれの科学者《かがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#5a3f33`,hairColor:`#7a5a3c`},story:[`スミレの花のしるなどが、まぜるものによって色を変えることを、くわしくしらべました。`,`色の変わり方をつかって、酸性《さんせい》とアルカリ性《せい》を見分けました。`,`空気をおしちぢめる実験《じっけん》でも知られ、「ボイルの法則《ほうそく》」に名前がのこっています。`],sayLabel:`いまのくらし`,say:`「リトマス紙」のように、色で見分ける方法は、今も理科の実験でつかわれています。`}},mirror:{running:`光のふしぎ　｜　かがみ`,why:{title:`なぜ、かがみにうつるの？`,paras:[`光は、ものに当たると、はねかえります。これを「反射《はんしゃ》」といいます。わたしたちは、ものからはねかえった光が目に入ることで、ものを見ています。`,`かがみは、とても平らでつるつるしています。光は、当たったときと同じ角度《かくど》で、きれいにそろってはねかえります。だから、ものの形がそのままうつります。`,`紙やかべには、こまかいでこぼこがあります。光がいろいろな向《む》きにちらばるので、うつりません。`,`月が光って見えるのも、太陽《たいよう》の光をはねかえしているからです。自転車《じてんしゃ》の反射板《はんしゃばん》も、反射をつかっています。`],terms:[[`反射《はんしゃ》`,`光がものに当たって、はねかえること。`],[`乱反射《らんはんしゃ》`,`でこぼこの面で、光がいろいろな向きにちらばること。`]]},person:{img:`alhazen`,name:`イブン・アル＝ハイサム`,years:`965年ごろ – 1040年ごろ`,who:`アラビアの科学者《かがくしゃ》`,look:{hair:`cap`,beard:`full`,collar:`toga`,cloth:`#7a6a4a`,hairColor:`#3a2f28`},story:[`いまのイラクに生まれたといわれ、エジプトでけんきゅうをしました。ヨーロッパでは「アルハゼン」の名で知られています。`,`むかしは「目から光が出て、ものが見える」と考えられていました。かれは「ものからの光が目に入るから見える」ということを、実験《じっけん》でたしかめました。`,`くらい部屋《へや》の小さなあなから、外のけしきがうつることもしらべました。カメラのもとになるしくみです。`],sayLabel:`のこしたもの`,say:`光についての大きな本を書きました。その本は、のちの科学者たちに長く読みつがれました。`}},pend:{running:`力のふしぎ　｜　ふりこ`,why:{title:`なぜ、糸《いと》の長さで決《き》まるの？`,paras:[`おもりを引《ひ》いてはなすと、地球《ちきゅう》に引っぱられて下へおります。いきおいがつくので、まん中を通りすぎて、反対《はんたい》がわへのぼります。これをくり返《かえ》します。`,`糸が長いと、おもりは大きなカーブをえがきます。動《うご》く道のりが長く、かたむきもゆるやかなので、1おうふくに時間がかかります。`,`おもりを重《おも》くすると、強く引っぱられます。でも、重いものは動かしにくいので、二つがちょうど打ち消《け》し合います。だから、速《はや》さは変わりません。`,`大きくふると、道のりは長くなりますが、そのぶん速く動きます。かかる時間は、ほとんど同じです。`],terms:[[`等時性《とうじせい》`,`ふれはばを変えても、1おうふくの時間がほとんど同じこと。`],[`1おうふく`,`行って、もどってくるまで。`]]},person:{img:`huygens`,name:`ホイヘンス`,years:`1629 – 1695`,who:`オランダの科学者《かがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#3d4656`,hairColor:`#4a3a2c`},story:[`ふりこがいつも同じ速《はや》さでゆれることに、はじめに気づいたのは、ガリレオだとつたえられています。`,`ホイヘンスは、このせいしつをつかって、1657年にふりこ時計《どけい》を作りました。それまでの時計より、ずっと正しく時間をはかれました。`,`ぼうえんきょうで、土星《どせい》のわの形をたしかめ、土星の月「タイタン」も見つけました。`],sayLabel:`のこしたもの`,say:`ふりこ時計は、その後、長いあいだ、いちばん正しい時計としてつかわれました。`}},air:{running:`もののふしぎ　｜　空気と水`,why:{title:`なぜ、空気《くうき》だけがちぢむの？`,paras:[`空気は、目に見えないほど小さなつぶが、とびまわってできています。つぶとつぶのあいだは、すきまだらけです。`,`とじこめておすと、すきまがつまって、小さくなります。つぶがかべに当たる回数《かいすう》がふえるので、おしかえす力が強くなります。`,`水は、つぶがぎっしりつまっています。すきまがほとんどないので、おしてもちぢみません。おした力は、そのまま先までつたわります。`,`空気でっぽうは、おしちぢめた空気がもとにもどろうとする力で、玉《たま》をおし出します。`],terms:[[`体積《たいせき》`,`ものの大きさ（かさ）。`],[`圧力《あつりょく》`,`おす力の強さ。`]]},person:{img:`guericke`,name:`ゲーリケ`,years:`1602 – 1686`,who:`ドイツの科学者《かがくしゃ》・市長《しちょう》`,look:{hair:`part`,beard:`point`,collar:`ruff`,cloth:`#3d4656`,hairColor:`#8a8478`},story:[`ドイツのマクデブルクという町の、市長でした。`,`空気《くうき》をぬくポンプを作りました。金《きん》ぞくの半球《はんきゅう》を2つ合わせて、中の空気をぬくと、たくさんの馬で両《りょう》がわから引っぱっても、はなれませんでした。`,`まわりの空気が、外から強くおしていたからです。空気にもおす力があることを、みんなの前で見せました。`],sayLabel:`のこしたもの`,say:`この実験《じっけん》は「マクデブルクの半球」とよばれ、今も理科の本にのっています。`}},dissolve:{running:`もののふしぎ　｜　とける`,why:{title:`なぜ、見えなくなるの？`,paras:[`しおのつぶは、水の中で、目に見えないほど小さく分かれます。そして、水ぜんたいに広《ひろ》がります。これが「とける」ということです。`,`かきまぜたり、あたためたりすると、水がよく動《うご》いて、早《はや》くとけます。`,`決《き》まった量《りょう》の水にとける量には、かぎりがあります。さとうは、しおよりずっとたくさんとけます。お湯《ゆ》にすると、さとうはもっととけますが、しおはほとんど変わりません。`,`すなは、水の中でも小さく分かれないので、とけません。まぜると水がにごり、しばらくすると、そこにしずみます。`,`しお水をあたためて、水をじょうはつさせると、しおが出てきます。海の水からしおを作るしくみです。`],terms:[[`水よう液《えき》`,`ものが水にとけた、すきとおったえき。`],[`じょうはつ`,`水が水じょう気になって、空気の中へ出ていくこと。`]]},person:{img:`lavoisier`,name:`ラボアジエ`,years:`1743 – 1794`,who:`フランスの化学者《かがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#33456a`,hairColor:`#ece8df`},story:[`とてもせいみつなてんびんをつかって、実験《じっけん》の前と後の重《おも》さを、こまかくはかりました。`,`ものがすがたを変えても、ぜんたいの重さは変わらないことを、たしかめて広《ひろ》めました。`,`ものがもえるのは、空気の中の酸素《さんそ》とむすびつくからだ、ということも明らかにしました。`],sayLabel:`のこしたもの`,say:`「はかって、たしかめる」というやり方で、今の化学《かがく》の土台《どだい》を作りました。`}},sound:{running:`音のふしぎ　｜　音`,why:{title:`なぜ、音《おと》が聞こえるの？`,paras:[`ものがふるえると、まわりの空気《くうき》もふるえます。そのふるえが、波《なみ》のようにつぎつぎとつたわって、耳のおくの「こまく」をふるわせます。これを、音として感《かん》じます。`,`1秒《びょう》にふるえる回数《かいすう》が多いほど、高い音になります。げんをみじかくしたり、強くはったりすると、速《はや》くふるえるので、高い音が出ます。`,`大きくふるえるほど、大きな音になります。`,`音は、空気や水のように、ふるえをつたえるものがないと、つたわりません。空気の中をすすむ速さは、1秒におよそ340mです。光《ひかり》よりずっとおそいので、かみなりは、光ってから少しおくれて音が聞こえます。`],terms:[[`しんどう`,`ものがふるえること。`],[`ヘルツ`,`1秒にふるえる回数をあらわすことば。`]]},person:{img:`bell`,name:`ベル`,years:`1847 – 1922`,who:`スコットランド生まれの発明家《はつめいか》`,look:{hair:`curly`,beard:`big`,collar:`bow`,cloth:`#3d4656`,hairColor:`#ece8df`},story:[`お母さんとおくさんは、耳が聞こえにくい人でした。ベルは、耳の聞こえない人に話し方を教える先生をしていました。`,`声《こえ》のふるえを電気《でんき》に変えて、遠くへ送《おく》るしくみを考え、1876年に電話《でんわ》のとっきょをとりました。`,`ふるえが音をはこぶことをよく知っていたから、できた発明でした。`],say:`「ワトソン君、ちょっと来てくれ」。はじめて電話でつたえたことばだといわれています。`}},hand:{running:`体のふしぎ　｜　手あらい`,why:{title:`なぜ、せっけんだとおちるの？`,paras:[`きんやウイルスは、とても小さくて目に見えません。手のしわや、つめのあいだ、ひふのあぶらにくっついています。`,`水だけでは、あぶらといっしょについたよごれは、おちにくいです。水とあぶらは、まざりにくいからです。`,`せっけんのつぶは、かたほうが水と、もうかたほうがあぶらとなかよしです。あぶらよごれをつつんで、水の中へうかせます。こすると、よごれがはがれやすくなります。`,`うかせたよごれは、水でよく流《なが》します。さいごに、きれいなタオルでふきます。ぬれたままだと、きんがつきやすくなります。`],terms:[[`きん（細菌《さいきん》）`,`目に見えない小さな生きもの。びょうきのもとになるものもある。`],[`ウイルス`,`きんよりもっと小さい。かぜなどのもとになる。`]]},person:{img:`kitasato`,name:`北里柴三郎《きたざとしばさぶろう》`,years:`1853 – 1931`,who:`日本の医学者《いがくしゃ》`,look:{hair:`part`,beard:`short`,collar:`bow`,glasses:!0,cloth:`#3d4656`,hairColor:`#3a3530`},story:[`熊本県《くまもとけん》に生まれ、ドイツでコッホ先生に学びました。`,`1889年、はしょうふう菌《きん》だけをとり出して育《そだ》てることに成功《せいこう》しました。つづいて、なかまのベーリングといっしょに、びょうきをなおす新しい方法《ほうほう》を発表《はっぴょう》しました。`,`日本に帰ってからは、うつるびょうきの研究所《けんきゅうじょ》を作り、たくさんの医者を育てました。`],sayLabel:`のこしたもの`,say:`びょうきは、かかる前にふせぐことが大切だ、という考えを広《ひろ》めました。千円札《せんえんさつ》の顔にもなっています。`}},heart:{running:`体のふしぎ　｜　心ぞう`,why:{title:`なぜ、動《うご》くと速《はや》く打つの？`,paras:[`心《しん》ぞうは、きん肉《にく》でできたふくろです。ぎゅっとちぢんで血《ち》をおし出し、ゆるんで血をためます。これをくり返《かえ》します。`,`血は、体じゅうに酸素《さんそ》とえいようをはこびます。心ぞうから出た血は、血かんを通って全身《ぜんしん》をめぐり、また心ぞうにもどります。`,`もどった血は、肺《はい》へ送《おく》られて、新しい酸素を受《う》けとります。そして、もう一度心ぞうにもどってから、全身へ送り出されます。`,`運動《うんどう》すると、きん肉がたくさんの酸素をつかいます。心ぞうは速く打って、血をたくさん送ります。いきが速くなるのも、酸素をたくさんとり入れるためです。`],terms:[[`脈《みゃく》`,`心ぞうが打つたびに、血かんがふくらむ動き。`],[`血《けっ》かん`,`血の通り道。`]]},person:{img:`harvey`,name:`ハーベイ`,years:`1578 – 1657`,who:`イギリスの医者《いしゃ》`,look:{hair:`part`,beard:`point`,collar:`ruff`,cloth:`#3d4656`,hairColor:`#5a4a3c`},story:[`むかしは、「血《ち》は体の中で作られ、体のはしでつかわれて、なくなる」と考えられていました。`,`ハーベイは、心《しん》ぞうが1回に送《おく》り出す血の量《りょう》と、打つ回数をしらべました。すると、1時間に送り出す血は、体重《たいじゅう》よりずっと多くなります。そんなにたくさん、作りつづけられるはずがありません。`,`「血は、体をめぐって、心ぞうにもどってくる」と気づき、1628年に本にまとめました。`],sayLabel:`すごいところ`,say:`はかって、計算《けいさん》して、たしかめる。そのやり方で、長くしんじられてきた考えをあらためました。`}},arm:{running:`体のふしぎ　｜　ほねときん肉`,why:{title:`なぜ、きん肉《にく》は2つでひと組《くみ》なの？`,paras:[`ほねは、体をささえ、のうや心《しん》ぞうなどをまもっています。おとなのほねは、およそ200こあります。`,`きん肉は、ちぢむことはできますが、じぶんでのびて、おすことはできません。だから、まげるきん肉と、のばすきん肉が、2つで1組になってはたらきます。`,`うでをまげるときは、力こぶのきん肉がちぢみ、うらがわのきん肉がゆるみます。のばすときは、そのぎゃくです。`,`きん肉のはしは、「けん」というじょうぶなすじで、ほねについています。きん肉がちぢむと、けんがほねを引《ひ》っぱって、関節《かんせつ》がまがります。`],terms:[[`関節《かんせつ》`,`ほねとほねのつなぎ目。`],[`けん`,`きん肉とほねをつなぐ、じょうぶなすじ。`]]},person:{img:`sugita`,name:`杉田玄白《すぎたげんぱく》`,years:`1733 – 1817`,who:`江戸時代《えどじだい》の医者《いしゃ》`,look:{hair:`cap`,collar:`toga`,cloth:`#4a5568`,hairColor:`#2b2b2b`},story:[`オランダ語で書かれた、体の中のつくりの本を手に入れました。じっさいの人の体と見くらべて、絵《え》がとても正しいことにおどろきました。`,`なかまといっしょに、ことばもよくわからないまま、何年もかけて日本語になおしました。`,`1774年、「解体新書《かいたいしんしょ》」という本にして出しました。日本の医学《いがく》が大きくすすむきっかけになりました。`],sayLabel:`のこしたもの`,say:`「神経《しんけい》」「軟骨《なんこつ》」などのことばは、この本でつかわれて広《ひろ》まりました。`}},rainbow:{running:`光のふしぎ　｜　にじ`,why:{title:`なぜ、色に分かれるの？`,paras:[`光《ひかり》は、空気《くうき》からガラスに入るとき、すすむ向《む》きが少しまがります。これを「屈折《くっせつ》」といいます。`,`まがり方は、色によって少しずつちがいます。赤はあまりまがらず、むらさきは大きくまがります。だから、プリズムを通ると、色ごとに分かれます。`,`空のにじは、空気の中の雨つぶが、プリズムのかわりをしています。太陽《たいよう》をせにして立つと見えます。外《そと》がわが赤、内《うち》がわがむらさきです。`,`テレビやスマホの画面《がめん》は、赤・みどり・青の小さな光を組《く》み合わせて、いろいろな色を作っています。`],terms:[[`屈折《くっせつ》`,`光が、べつのものに入るときに、まがること。`],[`光の三原色《さんげんしょく》`,`赤・みどり・青。重《かさ》ねると白になる。`]]},person:{img:`newton`,name:`ニュートン`,years:`1642 – 1727`,who:`イギリスの科学者《かがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#5a3f33`,hairColor:`#d9d2c4`},story:[`くらくした部屋《へや》に、まどのあなから日の光を入れ、プリズムに通しました。すると、かべに、にじ色のおびがうつりました。`,`分かれた色の光を、もう一度、集《あつ》めると、白い光にもどりました。白い光は、いろいろな色の光のあつまりだったのです。`,`ものとものが引《ひ》き合う力のきまりも見つけました。`],sayLabel:`つたわる話`,say:`りんごが木からおちるのを見て、引力《いんりょく》のことを考えた、という話がつたわっています。`}},cells:{running:`電気のふしぎ　｜　かん電池`,why:{title:`なぜ、つなぎ方で変《か》わるの？`,paras:[`電池《でんち》には、電気《でんき》をおし出す力があります。この力の大きさを「電圧《でんあつ》」といいます。`,`直列《ちょくれつ》つなぎは、電池をたてにつなぐので、おし出す力がたし合わされます。電気がたくさん流《なが》れて、明るくなります。`,`並列《へいれつ》つなぎは、電池を横にならべます。おし出す力は1このときと同じなので、明るさも同じくらいです。2こで分け合って電気を出すので、長もちしやすくなります。`,`電池の向《む》きをぎゃくにすると、おし出す力が打ち消《け》し合って、電気が流れません。並列でぎゃく向きにつなぐと、電池どうしで電気が流れて熱《あつ》くなるので、あぶないです。`],terms:[[`電圧《でんあつ》`,`電気をおし出す力の大きさ。`],[`直列《ちょくれつ》・並列《へいれつ》`,`たてにつなぐ・横にならべてつなぐ。`]]},person:{img:`volta`,name:`ボルタ`,years:`1745 – 1827`,who:`イタリアの科学者《かがくしゃ》`,look:{hair:`part`,collar:`cravat`,cloth:`#3d4656`,hairColor:`#8a8478`},story:[`「動物《どうぶつ》の体の中に電気《でんき》がある」という、ほかの学者《がくしゃ》の考えに、ぎもんをもちました。`,`ちがうしゅるいの金《きん》ぞくと、しお水をしみこませたものを重《かさ》ねると、電気が流《なが》れつづけることを見つけました。1800年のことです。`,`これが、世界《せかい》ではじめての電池《でんち》だといわれています。`],sayLabel:`のこしたもの`,say:`電気をおし出す力をあらわす「ボルト」は、ボルタの名前からつけられました。`}},lens:{running:`光のふしぎ　｜　虫めがね`,why:{title:`なぜ、さかさまにうつるの？`,paras:[`まん中がふくらんだレンズを「とつレンズ」といいます。通った光《ひかり》を内《うち》がわにまげて、1点に集《あつ》めます。この点を「しょう点」といいます。`,`ものをしょう点より遠くにおくと、レンズの反対《はんたい》がわに、さかさまの像《ぞう》ができます。そこにスクリーンをおくと、うつって見えます。`,`ものをレンズに近づけると、像は遠くに大きくできます。はなすと、近くに小さくできます。`,`ものをしょう点より近くにおくと、スクリーンにはうつりません。かわりに、レンズをのぞくと、大きく見えます。これが虫めがねのつかい方です。`],terms:[[`とつレンズ`,`まん中がふくらんだレンズ。光を集める。`],[`しょう点`,`レンズを通った光が集まる点。`]]},person:{img:`leeuwenhoek`,name:`レーウェンフック`,years:`1632 – 1723`,who:`オランダの商人《しょうにん》・研究者《けんきゅうしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#5a4a3c`,hairColor:`#6a5038`},story:[`デルフトという町で、布《ぬの》を売る店をしていました。`,`じぶんでレンズをみがいて、とても小さいけれど、よく見えるけんび鏡《きょう》を作りました。`,`それで水の1てきをのぞくと、小さな生きものがたくさん動《うご》いていました。目に見えない生きものを、もっとも早く見た人のひとりです。`],sayLabel:`すごいところ`,say:`学者《がくしゃ》ではありませんでしたが、見たことを手紙《てがみ》に書いて、イギリスの学者たちに送《おく》りつづけました。`}},leaf:{running:`生きもののふしぎ　｜　葉と日光`,why:{title:`なぜ、日光《にっこう》がいるの？`,paras:[`葉《は》は、日光を受《う》けると、水と、空気《くうき》の中の二酸化炭素《にさんかたんそ》から、でんぷんなどのえいようを作ります。これを「光合成《こうごうせい》」といいます。このとき、酸素《さんそ》を出します。`,`作ったえいようは、くきを通って、体じゅうにはこばれます。そだつためにつかわれたり、実《み》やいも、たねにたくわえられたりします。`,`夜《よる》のあいだは、でんぷんを作れません。葉のでんぷんは、はこばれたりつかわれたりして、朝にはほとんどなくなります。`,`動物《どうぶつ》は、じぶんでえいようを作れません。植物《しょくぶつ》の作るえいようと酸素が、生きものをささえています。`],terms:[[`光合成《こうごうせい》`,`葉が光を受けて、えいようを作るはたらき。`],[`二酸化炭素《にさんかたんそ》`,`空気の中に少しふくまれている気体《きたい》。`]]},person:{img:`ingenhousz`,name:`インゲンホウス`,years:`1730 – 1799`,who:`オランダ生まれの医者《いしゃ》・科学者《かがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#4a5a3c`,hairColor:`#ece8df`},story:[`水の中に入れた植物《しょくぶつ》から、あわが出るのを、くわしくしらべました。`,`あわが出るのは、みどりの葉《は》に、日光《にっこう》が当たっているときだけでした。くらいところでは出ません。1779年に本にまとめました。`,`このあわは、ものをよくもやす「よい空気《くうき》」でした。今でいう酸素《さんそ》です。`],sayLabel:`わかったこと`,say:`植物は、日光を受《う》けて、わたしたちがすう空気をきれいにしています。`}},state:{running:`もののふしぎ　｜　水のすがた`,why:{title:`なぜ、温度《おんど》が止まるの？`,paras:[`水は、目に見えないほど小さなつぶが集《あつ》まってできています。こおりのときは、つぶがきちんとならんで、ほとんど動《うご》けません。`,`あたためると、つぶが動きだして、ならびがくずれます。これが水です。もっとあたためると、つぶはばらばらにとび出して、水《すい》じょう気《き》になります。`,`こおりがとけているあいだと、水がふっとうしているあいだは、あたためても温度が上がりません。熱《ねつ》が、つぶのならびをくずすためにつかわれるからです。`,`水は、こおると少しふくらみます。だから、こおりは水にうきます。高い山の上では、100℃より低《ひく》い温度でふっとうします。`],terms:[[`ふっとう`,`水の中から、さかんにあわが出て、水じょう気になること。`],[`水《すい》じょう気《き》`,`気体《きたい》になった水。目に見えない。`]]},person:{img:`celsius`,name:`セルシウス`,years:`1701 – 1744`,who:`スウェーデンの天文学者《てんもんがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#33456a`,hairColor:`#ece8df`},story:[`1742年、だれがはかっても同じになる、温度《おんど》の目もりを考えました。`,`水がこおる温度と、ふっとうする温度を目じるしにして、そのあいだを100に分けたのです。`,`はじめは、ふっとうする温度が0、こおる温度が100で、今とはぎゃくでした。のちに入れかえられて、今の形になりました。`],sayLabel:`のこしたもの`,say:`温度をあらわす「℃」は、「セルシウス度《ど》」といいます。`}},fall:{running:`力のふしぎ　｜　落ちる`,why:{title:`なぜ、同時に落ちるの？`,paras:[`地球《ちきゅう》は、すべてのものを下に引《ひ》っぱっています。この力を「重力《じゅうりょく》」といいます。重《おも》いものほど、強く引っぱられます。`,`でも、重いものは、動かしはじめるのに大きな力がいります。強く引っぱられるぶんと、動かしにくいぶんが、ちょうど打《う》ち消《け》し合うので、落ちるはやさは同じになります。`,`羽《はね》や紙《かみ》がゆっくり落ちるのは、空気《くうき》におし返されるからです。空気をぬいたつつの中では、羽も鉄《てつ》の玉も、同時に落ちます。`,`落ちるものは、だんだんはやくなります。高いところから落ちたものほど、いきおいよく地面《じめん》にぶつかります。`],terms:[[`重力《じゅうりょく》`,`地球がものを引っぱる力。`],[`空気《くうき》ていこう`,`動くものを、空気がおし返す力。`]]},person:{img:`scott`,name:`デイビッド・スコット`,years:`1932 –`,who:`アメリカの宇宙飛行士《うちゅうひこうし》`,look:{hair:`short`,collar:`none`,cloth:`#e8eaee`,hairColor:`#6a5a4a`},story:[`1971年、アポロ15号で月へ行きました。`,`月には空気《くうき》がありません。スコットは月の上で、ハンマーとハヤブサの羽《はね》を、同じ高さから同時にはなしました。`,`2つは、同時に月の地面《じめん》につきました。400年ほど前にガリレオが考えたことを、月でたしかめたのです。`],sayLabel:`ガリレオの話`,say:`ガリレオがピサのしゃとうから玉を落とした、という話が有名《ゆうめい》です。ただ、ほんとうにやったかどうかは、わかっていません。`}},pulley:{running:`力のふしぎ　｜　かっ車`,why:{title:`なぜ、半分の力ですむの？`,paras:[`定《てい》かっ車は、天じょうなどにとめてつかいます。力の大きさは変《か》わりませんが、下に引《ひ》いて、ものを上げられます。体の重《おも》さをかけられるので、らくに感《かん》じます。`,`動《どう》かっ車は、おもりといっしょに動きます。おもりを、2本のひもでささえることになるので、1本あたりの力は半分ですみます。`,`そのかわり、おもりを1m上げるのに、ひもを2m引かないといけません。力でとくをしたぶん、長さでそんをします。`,`かっ車をたくさん組《く》み合わせると、もっと小さな力で、重いものを上げられます。クレーンは、このしくみをつかっています。`],terms:[[`定《てい》かっ車`,`場所が動かないかっ車。力の向《む》きを変える。`],[`動《どう》かっ車`,`おもりといっしょに動くかっ車。力が半分ですむ。`]]},person:{img:`archimedes`,name:`アルキメデス`,years:`紀元前《きげんぜん》287年ごろ – 紀元前212年`,who:`古代《こだい》ギリシャの科学者《かがくしゃ》`,look:{hair:`curly`,beard:`full`,collar:`toga`,cloth:`#e9e2d0`,hairColor:`#d8d4cc`},story:[`てこや、かっ車のしくみを、くわしくしらべました。`,`王さまの前で、かっ車をいくつも組《く》み合わせた道具《どうぐ》をつかい、荷物《にもつ》をつんだ大きな船を、ひとりで引《ひ》きよせてみせた、という話がつたわっています。`],sayLabel:`つたわることば`,say:`「わたしに立つ場所をくれれば、地球《ちきゅう》を動かしてみせよう」`}},spring:{running:`力のふしぎ　｜　ばね`,why:{title:`なぜ、同じわりあいでのびるの？`,paras:[`ばねは、形を変《か》えられると、もとにもどろうとします。この力は、のばせばのばすほど、強くなります。`,`おもりをつるすと、ばねはのびていきます。そして、もどろうとする力が、おもりの重《おも》さとつり合ったところで、止まります。`,`おもりが2ばいになると、つり合うために、2ばいの力がいります。だから、のびも2ばいになります。これを「フックのほうそく」といいます。`,`ただし、引《ひ》っぱりすぎると、ばねはのびきって、もとにもどらなくなります。ゴムも、のばすともどろうとしますが、のび方は、ばねほどきれいにそろいません。`],terms:[[`だんせい`,`形を変えられたものが、もとにもどろうとするせいしつ。`],[`ばねばかり`,`ばねののびで、重さや力をはかる道具《どうぐ》。`]]},person:{img:`hooke`,name:`フック`,years:`1635 – 1703`,who:`イギリスの科学者《かがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#4a3f38`,hairColor:`#5a4a3c`},story:[`ばねののびは、引《ひ》っぱる力にあわせて大きくなる、というきまりを見つけました。1678年に本で発表《はっぴょう》しました。`,`じぶんでくふうしたけんび鏡《きょう》で、いろいろなものを見て、絵《え》にのこしました。`,`コルクをうすく切って見ると、小さなへやがたくさんならんでいました。フックは、これを「セル（小べや）」と名づけました。今の「細胞《さいぼう》」ということばのはじまりです。`],sayLabel:`のこしたもの`,say:`ばねのきまりは、今も「フックのほうそく」とよばれています。`}},static:{running:`電気のふしぎ　｜　せいでんき`,why:{title:`なぜ、こするとたまるの？`,paras:[`どんなものにも、プラスの電気《でんき》とマイナスの電気が、同じ数だけ入っています。ふだんは、打《う》ち消《け》し合っているので、何もおこりません。`,`ちがうものどうしをこすり合わせると、マイナスの電気のつぶが、かたほうからもうかたほうへ、うつります。すると、かたほうはプラス、もうかたほうはマイナスの電気をもちます。`,`プラスとマイナスは引《ひ》き合い、同じものどうしは、しりぞけ合います。電気をもった風船《ふうせん》を近づけると、紙《かみ》きれの中の電気がかたよって、引きよせられます。`,`たまった電気が、いちどに流《なが》れると、パチッと火花《ひばな》が出ます。かみなりは、雲《くも》にたまった電気が流れる、とても大きな火花です。`],terms:[[`せいでんき`,`ものにたまって、流れずにいる電気。`],[`プラス・マイナス`,`電気の2つのしゅるい。ちがうものどうしは引き合う。`]]},person:{img:`franklin`,name:`フランクリン`,years:`1706 – 1790`,who:`アメリカの科学者《かがくしゃ》・政治家《せいじか》`,look:{hair:`bald`,glasses:!0,collar:`cravat`,cloth:`#4a3f38`,hairColor:`#b9b3a4`},story:[`「かみなりは、電気《でんき》ではないか」と考えました。`,`1752年、かみなり雲《ぐも》の下でたこをあげて、たしかめたとつたえられています。とてもあぶないので、ぜったいにまねをしてはいけません。`,`たてものをかみなりからまもる「ひらいしん」を考え、広めました。`],sayLabel:`ほかのしごと`,say:`いんさつの仕事《しごと》から身《み》をおこし、アメリカという国をつくるときにも、大きなはたらきをしました。`}},motor:{running:`電気のふしぎ　｜　モーター`,why:{title:`なぜ、回りつづけるの？`,paras:[`どう線《せん》をまいたコイルに電気《でんき》を流《なが》すと、コイルは、N極《きょく》とS極のあるじしゃくになります。`,`そばにじしゃくをおくと、同じ極どうしはしりぞけ合い、ちがう極どうしは引《ひ》き合います。この力で、コイルが回ります。`,`半分回ると、引き合うところで止まってしまいそうです。そこでモーターは、半分回るたびに、電気の流れる向《む》きを切りかえています。すると、また、しりぞけ合うので、回りつづけます。`,`じしゃくが強いほど、流れる電気が多いほど、モーターは力強く回ります。ぎゃくに、モーターを手で回すと、電気が生まれます。これが発電機《はつでんき》です。`],terms:[[`コイル`,`どう線を何回もまいたもの。`],[`発電機《はつでんき》`,`回す力から、電気を作るきかい。`]]},person:{img:`oersted`,name:`エルステッド`,years:`1777 – 1851`,who:`デンマークの科学者《かがくしゃ》`,look:{hair:`curly`,collar:`cravat`,cloth:`#2f3a4a`,hairColor:`#5a4a3c`},story:[`1820年、どう線《せん》に電気《でんき》を流《なが》すと、近くにおいた方位《ほうい》じしんのはりが、ぴくりと動くことに気づきました。`,`学生に教えているときに気づいた、とつたえられています。`,`それまで、電気とじしゃくは、べつべつのものだと考えられていました。この発見《はっけん》から、電じしゃくやモーターが生まれました。`],sayLabel:`つながり`,say:`この話を聞いたファラデーたちが、研究《けんきゅう》をすすめ、モーターや発電機《はつでんき》のもとを作りました。`}},crystal:{running:`もののふしぎ　｜　結晶`,why:{title:`なぜ、きまった形になるの？`,paras:[`水にとけたものは、目に見えないほど小さなつぶになって、水の中にちらばっています。`,`ミョウバンは、あたたかい水に、たくさんとけます。ひやすと、とけていられる量《りょう》がへるので、とけきれなくなったぶんが、つぶになって出てきます。`,`このとき、小さなつぶは、きまったならび方で、きちんとつみ重《かさ》なります。だから、ミョウバンは正八面体《せいはちめんたい》、しおはさいころの形、というように、ものによって形がきまっています。`,`ゆっくりひやすと、つぶは、先にできた結晶《けっしょう》にじゅんばんにくっつくので、大きくそだちます。いそぐと、あちこちで同時にでき、小さな結晶がたくさんになります。`],terms:[[`結晶《けっしょう》`,`つぶがきそく正しくならんでできた、きまった形のかたまり。`],[`ほうわ`,`それいじょう、とけきれなくなったようす。`]]},person:{img:`nakaya`,name:`中谷宇吉郎《なかやうきちろう》`,years:`1900 – 1962`,who:`日本《にほん》の物理学者《ぶつりがくしゃ》`,look:{hair:`short`,glasses:!0,collar:`pc`,cloth:`#3a3f4a`,hairColor:`#23252e`},story:[`石川県《いしかわけん》に生まれ、北海道《ほっかいどう》の大学で、雪《ゆき》の結晶《けっしょう》をしらべました。`,`何千《なんぜん》まいもしゃしんをとり、雪の形が、空の温度《おんど》やしめりけで変《か》わることをつきとめました。`,`1936年、とてもさむいじっけん室で、世界《せかい》ではじめて、人の手で雪の結晶を作りました。`],sayLabel:`知られることば`,say:`「雪は天からおくられた手紙《てがみ》である」`}},warm:{running:`もののふしぎ　｜　熱気球`,why:{title:`なぜ、あたたかい空気は上がるの？`,paras:[`空気《くうき》は、目に見えない小さなつぶでできています。あたためると、つぶがはげしく動き、つぶとつぶのあいだが広がります。`,`すると、同じ大きさのふくろに入るつぶの数が、へります。つまり、あたたかい空気は、つめたい空気より軽《かる》くなります。`,`軽い空気は、まわりの重《おも》い空気におし上げられて、上へのぼります。水の中で、軽いものがうくのと同じです。`,`上がった空気のあとには、つめたい空気が流《なが》れこみます。これがくり返されて、空気がぐるぐる回ることを「対流《たいりゅう》」といいます。風《かぜ》がふくのも、このしくみです。`],terms:[[`対流《たいりゅう》`,`あたたまった空気や水が、動いて回ること。`],[`ぼうちょう`,`あたためられて、ふくらむこと。`]]},person:{img:`montgolfier`,name:`モンゴルフィエ兄弟《きょうだい》`,years:`1783年に気球《ききゅう》をとばす`,who:`フランスの発明家《はつめいか》`,look:{hair:`wig`,collar:`cravat`,cloth:`#5a3f4a`,hairColor:`#ece8df`},story:[`兄《あに》のジョゼフと、弟《おとうと》のジャックは、紙《かみ》を作る家に生まれました。`,`火であたためた空気《くうき》をふくろにためると、うき上がることに気づき、大きな気球を作りました。`,`1783年、まず、ひつじ・あひる・にわとりをのせてとばしました。同じ年のうちに、人をのせた気球も、空をとびました。のったのは、兄弟ではなく、べつの2人です。`],sayLabel:`すごいところ`,say:`ひこうきができる、100年いじょうも前に、人は空をとんだのです。`}},medaka:{running:`生きもののふしぎ　｜　メダカのたまご`,why:{title:`たまごの中で、どうそだつの？`,paras:[`メスがうんだたまごと、オスが出す「精子《せいし》」がむすびつくと、たまごはそだちはじめます。これを「受精《じゅせい》」といいます。`,`はじめは1つのつぶですが、2つ、4つ、8つと分かれて、数がふえていきます。やがて、体のもとができ、目や心《しん》ぞうがはっきりしてきます。`,`たまごの中には、えいようが入っています。子メダカは、そのえいようをつかって大きくなり、まくをやぶって出てきます。`,`かえるまでの日数は、水温《すいおん》で変《か》わります。あたたかいほど、中の変化《へんか》がはやくすすみます。人も、おなかの中で、1つのたまごからそだちます。`],terms:[[`受精《じゅせい》`,`たまごと精子がむすびつくこと。`],[`ふ化《か》`,`たまごから、子がかえること。`]]},person:{img:`siebold`,name:`シーボルト`,years:`1796 – 1866`,who:`ドイツの医者《いしゃ》`,look:{hair:`part`,collar:`cravat`,cloth:`#2f3a4a`,hairColor:`#6a5038`},story:[`江戸時代《えどじだい》の1823年、オランダの船で、長崎《ながさき》へやって来ました。`,`日本《にほん》の人に医学《いがく》を教えながら、日本の動物《どうぶつ》や植物《しょくぶつ》を、たくさん集《あつ》めました。`,`シーボルトたちが集めたひょう本をもとに、ヨーロッパの学者《がくしゃ》が本を作り、メダカにも、世界《せかい》でつうじる名前がつけられました。`],sayLabel:`メダカの名前`,say:`メダカの学名《がくめい》は「オリジアス・ラティペス」。「オリジアス」は、イネをあらわすことばからきています。田んぼにすむ魚だからです。`}},butterfly:{running:`生きもののふしぎ　｜　チョウの一生`,why:{title:`なぜ、すがたを変《か》えるの？`,paras:[`よう虫《ちゅう》のしごとは、食べて大きくなることです。体の外がわの皮《かわ》はのびないので、きつくなると、ぬぎすてて、ひと回り大きくなります。モンシロチョウは、4回皮をぬぎます。`,`じゅうぶん大きくなると、さなぎになります。さなぎの中では、よう虫の体がいちどとけるようにくずれて、はねや、長い足や、ストローのような口が、あたらしく作られます。`,`成虫《せいちゅう》のしごとは、とび回って、あいてを見つけ、たまごをうむことです。花のみつをすいますが、体はもう大きくなりません。`,`よう虫と成虫で、食べものもくらす場所もちがうので、親《おや》と子が、えさをとり合わずにすみます。`],terms:[[`だっぴ`,`古い皮をぬいで、大きくなること。`],[`う化《か》`,`さなぎから、成虫が出てくること。`]]},person:{img:`fabre`,name:`ファーブル`,years:`1823 – 1915`,who:`フランスのこん虫学者《ちゅうがくしゃ》`,look:{hair:`hat`,beard:`none`,collar:`cravat`,cloth:`#3a3530`,hairColor:`#8a8478`},story:[`まずしい家に生まれ、はたらきながら勉強《べんきょう》して、学校の先生になりました。`,`先生をしながら、虫を何時間《なんじかん》もじっと見つづけました。フンコロガシやハチが、どうやってくらしているのかを、じぶんの目でたしかめました。`,`見たことを、だれにでもわかることばで書いたのが『こん虫記《ちゅうき》』です。ぜんぶで10さつあります。`],sayLabel:`すごいところ`,say:`本で読んだことより、じぶんの目で見たことを、だいじにしました。`}},eclipse:{running:`うちゅうのふしぎ　｜　日食と月食`,why:{title:`なぜ、毎月はおきないの？`,paras:[`月は、地球《ちきゅう》のまわりを、およそ1か月で1しゅうします。太陽《たいよう》と地球のあいだに月が来るのが新月《しんげつ》、反対《はんたい》がわに来るのが満月《まんげつ》です。`,`それなら、毎月、日食《にっしょく》と月食《げっしょく》がおきそうです。でも、月の通り道は、少しかたむいています。`,`そのため、たいていは、月が太陽の上や下を通りすぎます。3つがぴったり一直線《いっちょくせん》にならんだときだけ、日食や月食になります。`,`月食の月が赤黒く見えるのは、地球の空気《くうき》を通りぬけた赤い光《ひかり》が、少しだけ月にとどくからです。夕やけが赤いのと、同じわけです。`],terms:[[`かいき日食`,`太陽がぜんぶ、月にかくれる日食。`],[`新月《しんげつ》`,`月が太陽と同じ向《む》きにあり、見えないとき。`]]},person:{img:`thales`,name:`タレス`,years:`紀元前《きげんぜん》6世紀《せいき》ごろ`,who:`古代《こだい》ギリシャの学者《がくしゃ》`,look:{hair:`bald`,beard:`full`,collar:`toga`,cloth:`#e9e2d0`,hairColor:`#d8d4cc`},story:[`今のトルコにあった、ミレトスという町の人です。`,`紀元前585年におきた日食《にっしょく》を、前もって言い当てた、とつたえられています。ほんとうに言い当てられたのかどうかは、今もはっきりしていません。`,`むかしの人は、ふしぎなできごとを、神《かみ》さまのしわざだと考えていました。タレスは、しぜんのきまりで説明《せつめい》しようとした、さいしょの人のひとりです。`],sayLabel:`こんなことも`,say:`こはくをこすると、ほこりを引《ひ》きよせることにも、気づいていたといわれます。せいでんきについての、いちばん古い言いつたえのひとつです。`}},river:{running:`大地のふしぎ　｜　流れる水`,why:{title:`なぜ、外がわがけずられるの？`,paras:[`水は、まっすぐすすもうとします。川がまがっていると、水は外がわの岸《きし》にぶつかりながら、向《む》きを変《か》えます。だから、外がわは流《なが》れが速く、深《ふか》くけずられます。`,`内がわは、流れがおそくなります。おそい水は、土やすなを運《はこ》ぶ力が弱《よわ》いので、そこにおいていきます。こうして、内がわには川原《かわら》ができます。`,`外がわがけずられ、内がわにつもると、川のまがりは、だんだん大きくなります。`,`山の中の川は、かたむきが急《きゅう》で、流れが速く、大きな石がごろごろしています。海に近い川は、流れがゆるやかで、すなやどろがつもります。`],terms:[[`しん食`,`流れる水が、地面《じめん》をけずること。`],[`たい積《せき》`,`運ばれた土やすなが、つもること。`]]},person:{img:`hutton`,name:`ハットン`,years:`1726 – 1797`,who:`スコットランドの地質学者《ちしつがくしゃ》`,look:{hair:`wig`,collar:`cravat`,cloth:`#4a3f38`,hairColor:`#ece8df`},story:[`じぶんの農場《のうじょう》で、雨や川が、土を少しずつけずっていくのを、見つづけました。`,`けずられた土は、海のそこにつもって、岩《いわ》になります。それがもち上がって陸《りく》になり、また、けずられます。ハットンは、これが気の遠くなるほど長い時間をかけて、くり返されていると考えました。`,`地球《ちきゅう》は、とても古い。そう考えた、さいしょの人のひとりです。`],sayLabel:`よばれ方`,say:`「近代地質学《きんだいちしつがく》の父」とよばれています。`}},cloud:{running:`大地のふしぎ　｜　雲と雨`,why:{title:`なぜ、山で雨がふるの？`,paras:[`海や川の水は、太陽《たいよう》にあたためられて、水《すい》じょう気《き》になります。水じょう気は、目に見えません。`,`水じょう気をふくんだ空気《くうき》が上へのぼると、ふくらんで、ひえます。高い空は、まわりからおす力が弱いからです。ひえると、水じょう気は小さな水や氷《こおり》のつぶにもどります。これが雲《くも》です。`,`風《かぜ》が山にぶつかると、空気は山にそってのぼり、ひえます。だから、山には雲ができやすく、雨や雪《ゆき》がよくふります。`,`ふった水は、川になり、海へもどります。水は、すがたを変《か》えながら、地球《ちきゅう》をぐるぐるめぐっています。これを「水のじゅんかん」といいます。`],terms:[[`じょうはつ`,`水が、水じょう気になること。`],[`水のじゅんかん`,`水が、海・空・陸《りく》をめぐること。`]]},person:{img:`howard`,name:`ハワード`,years:`1772 – 1864`,who:`イギリスの気象学者《きしょうがくしゃ》`,look:{hair:`part`,collar:`cravat`,cloth:`#2f3a4a`,hairColor:`#8a8478`},story:[`薬品《やくひん》を作る仕事《しごと》をしながら、毎日、空をながめて、雲《くも》のスケッチをつづけました。`,`雲は、でたらめな形に見えます。でも、ハワードは、いくつかのきまった形に分けられることに気づきました。`,`1802年、雲に「けん雲（すじ雲）」「せき雲（わた雲）」「そう雲（きり雲）」などの名前をつけて、発表《はっぴょう》しました。`],sayLabel:`のこしたもの`,say:`今の天気予報《てんきよほう》でつかう雲の名前も、ハワードの考えた分け方が、もとになっています。`}},strata:{running:`大地のふしぎ　｜　地層`,why:{title:`地層《ちそう》から、何がわかるの？`,paras:[`川が運《はこ》んだ土やすなは、海や、みずうみのそこに、しずんでつもります。大きいつぶほど速くしずむので、つぶの大きさごとに分かれて、かさなります。`,`大雨《おおあめ》のたびに、あたらしい土が流《なが》れこみ、上へ上へとつもっていきます。だから、ふつうは、下の地層ほど古く、上の地層ほどあたらしいのです。`,`長い年月《ねんげつ》がたつと、つもったものは、おしかためられて、かたい岩《いわ》になります。そこにうまった生きものが、化石《かせき》です。`,`大きな力がかかると、地層は、まがったり、ずれたりします。ずれたところを「だんそう」といいます。だんそうが、きゅうにずれると、地《じ》しんがおきます。`],terms:[[`れき・すな・どろ`,`つぶの大きいじゅんのよび名。`],[`だんそう`,`地層が、力を受《う》けてずれたところ。`]]},person:{img:`steno`,name:`ステノ`,years:`1638 – 1686`,who:`デンマークの学者《がくしゃ》`,look:{hair:`part`,collar:`ruff`,cloth:`#2a2a30`,hairColor:`#6a5038`},story:[`もとは、体のつくりをしらべる医者《いしゃ》でした。`,`サメの頭《あたま》をしらべたとき、その歯《は》が、山の岩《いわ》から出てくる「ふしぎな石」とそっくりなことに気づきました。石は、大むかしのサメの歯だったのです。`,`なぜ、海の生きものが山の岩の中にあるのか。ステノは、地層《ちそう》は水のそこでつもったもので、下にあるものほど古い、と考えました。1669年のことです。`],sayLabel:`のこしたもの`,say:`「下の地層ほど古い」という考えは、今も、地層をしらべるときのきほんです。`}},volcano:{running:`大地のふしぎ　｜　火山`,why:{title:`なぜ、ふん火するの？`,paras:[`地球《ちきゅう》の中は、とても熱《あつ》く、深《ふか》いところでは、岩《いわ》がとけてマグマになっています。マグマは、まわりの岩より軽《かる》いので、上へ上がってきます。`,`マグマには、ガスがとけこんでいます。地面《じめん》の近くまで来ると、ガスがあわになって、いっきにふくらみます。ふったサイダーのふたをあけたときと同じです。これが、ふん火です。`,`さらさらのマグマは、ガスがぬけやすいので、よう岩《がん》がしずかに流《なが》れ出します。ねばねばのマグマは、ガスがぬけにくく、はげしくばくはつして、火山《かざん》ばいを高くふき上げます。`,`火山は、こわいだけではありません。温泉《おんせん》がわき、火山ばいのつもった土地は、長い年月をかけて、ゆたかな畑《はたけ》になります。`],terms:[[`マグマ`,`地下《ちか》で、岩がとけたもの。`],[`よう岩《がん》`,`地上《ちじょう》に出たマグマ。ひえてかたまったものも、こうよぶ。`]]},person:{img:`pliny`,name:`小プリニウス`,years:`61ごろ – 113ごろ`,who:`古代《こだい》ローマの文《ぶん》を書く人・政治家《せいじか》`,look:{hair:`short`,collar:`toga`,cloth:`#e9e2d0`,hairColor:`#5a4a3c`},story:[`17さいか18さいのとき、イタリアのベスビオ山が大ふん火するのを、海のむこうから見ました。西れき79年のことです。`,`学者《がくしゃ》だったおじは、人びとをたすけに船で向《む》かい、そこでなくなりました。`,`小プリニウスは、あとになって、見たことを手紙《てがみ》にくわしく書きのこしました。かさをひらいた松《まつ》の木のような形の雲《くも》が、山から立ちのぼった、と書いています。`],sayLabel:`のこしたもの`,say:`この手紙は、ふん火のようすをくわしくつたえる、いちばん古い記録《きろく》のひとつです。`}},stars:{running:`うちゅうのふしぎ　｜　星座`,why:{title:`なぜ、北極星《ほっきょくせい》は動かないの？`,paras:[`地球《ちきゅう》は、北極《ほっきょく》と南極《なんきょく》をむすぶ「じく」を中心に、1日に1回、回っています。これを自転《じてん》といいます。`,`わたしたちは、地球といっしょに回っているので、空の星のほうが、動いて見えます。1日は24時間、1回りは360度《ど》なので、1時間に15度ずつ動きます。`,`北極星は、じくをのばした先の、すぐ近くにあります。回るこまを、まうえから見ると、まん中だけは動いて見えません。北極星がほとんど動かないのは、そのためです。`,`北斗七星《ほくとしちせい》のひしゃくの先の2つの星をむすび、5ばいのばすと、北極星が見つかります。カシオペヤ座《ざ》からも、さがせます。`],terms:[[`自転《じてん》`,`地球が、こまのように回ること。`],[`1等星《とうせい》`,`とくに明るい星。数字が大きいほど、くらい。`]]},person:{img:`hipparchus`,name:`ヒッパルコス`,years:`紀元前《きげんぜん》190年ごろ – 紀元前120年ごろ`,who:`古代《こだい》ギリシャの天文学者《てんもんがくしゃ》`,look:{hair:`curly`,beard:`full`,collar:`toga`,cloth:`#e9e2d0`,hairColor:`#5a4a3c`},story:[`ぼうえん鏡《きょう》のない時代《じだい》に、じぶんの目と道具《どうぐ》で、星の場所を、ひとつずつはかりました。`,`およそ850この星の場所をまとめた、星の表《ひょう》を作ったといわれています。`,`星を明るさで6つに分け、いちばん明るい星を1等星《とうせい》、やっと見える星を6等星とした、とされています。`],sayLabel:`のこしたもの`,say:`「1等星」「2等星」という言い方は、2000年いじょうたった今も、つかわれています。`}}},iC={magnet:Ef,seesaw:pm,pend:Rg,fall:Mb,pulley:zb,spring:Jb,emag:Bh,elec:Jp,cells:fy,static:ax,motor:dx,float:Gf,ice:pp,state:hb,color:ng,dissolve:h
